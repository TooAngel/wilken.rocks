<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wilken.rocks</title>
  <link rel="canonical" href="https://www.wilken.rocks/">
  <style>
    :root { color-scheme: dark light; --bg: #0b1220; --text: #e8f6ff; --accent: #38bdf8; }
    @media (prefers-color-scheme: light) { :root { --bg: #eef4fb; --text: #0b1220; --accent: #0284c7; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 600 clamp(2rem, 8vw, 4rem)/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    span { color: var(--accent); }
  </style>
</head>
<body>
  <h1>wilken<span>.rocks</span></h1>
</body>
</html>
